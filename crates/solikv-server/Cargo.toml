[package]
name = "solikv-server"
version = "0.4.3"
edition = "2021"

[[bin]]
name = "solikv"
path = "src/main.rs"

[dependencies]
solikv-core = { workspace = true }
solikv-resp = { workspace = true }
solikv-engine = { workspace = true }
solikv-pubsub = { workspace = true }
solikv-persist = { workspace = true }
solikv-cluster = { workspace = true }
bytes = { workspace = true }
tokio = { workspace = true }
axum = { version = "0.8", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { version = "4", features = ["derive"] }
mimalloc = { version = "0.1", default-features = false }
futures = "0.3"
chrono = "0.4"
rustls = "0.23"
tokio-rustls = "0.26"
pem = "3"
base64 = "0.22"
nix = { version = "0.27", features = ["process", "signal"] }
libc = "0.2"
parking_lot = { workspace = true }

[dev-dependencies]
redis = { version = "0.27", features = ["tokio-comp", "cluster"] }
reqwest = { version = "0.12", features = ["json"] }
tokio = { workspace = true, features = ["test-util"] }
tempfile = "3"
rcgen = { version = "0.13", default-features = false, features = ["aws_lc_rs", "pem"] }
