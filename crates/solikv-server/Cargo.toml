[package]
name = "solikv-server"
version = "0.4.2"
edition = "2021"

[[bin]]
name = "solikv"
path = "src/main.rs"

[dependencies]
solikv-core = { workspace = true }
solikv-resp = { workspace = true }
solikv-engine = { workspace = true }
solikv-pubsub = { workspace = true }
solikv-persist = { workspace = true }
solikv-cluster = { workspace = true }
bytes = { workspace = true }
tokio = { workspace = true }
axum = { version = "0.8", features = ["ws"] }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "http1", "service"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { version = "4", features = ["derive"] }
mimalloc = { version = "0.1", default-features = false }
futures = "0.3"
chrono = "0.4"
rustls = "0.23"
tokio-rustls = "0.26"
pem = "3"
nix = { version = "0.27", features = ["process", "signal"] }
libc = "0.2"

[dev-dependencies]
redis = { version = "0.27", features = ["tokio-comp"] }
reqwest = { version = "0.12", features = ["json"] }
tokio = { workspace = true, features = ["test-util"] }
